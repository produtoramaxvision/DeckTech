name: Report a bug
description: Report a reproducible defect, without sensitive data. (Relate um defeito reproduzível, sem dados sensíveis.)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Write in English or Portuguese (Escreva em inglês ou português).

        Do not post PINs, tokens, keys, private IP addresses, or unreviewed logs. Vulnerabilities must follow [SECURITY.md](https://github.com/produtoramaxvision/DeckTech/blob/main/SECURITY.md) and must not be reported here.

        Não publique PINs, tokens, chaves, IPs privados ou logs não revisados. Vulnerabilidades seguem o [SECURITY.pt-BR.md](https://github.com/produtoramaxvision/DeckTech/blob/main/SECURITY.pt-BR.md).
  - type: dropdown
    id: platform
    attributes:
      label: Platform (Plataforma)
      options:
        - Windows host
        - macOS host
        - Android APK
        - iPhone/iPad PWA
        - Other browser
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (Versão)
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps (Passos para reproduzir)
      description: List minimal, deterministic steps. (Liste passos mínimos e determinísticos.)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result (Resultado esperado)
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result (Resultado observado)
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks (Verificações)
      options:
        - label: I removed sensitive data and confirmed this is not a vulnerability. (Removi dados sensíveis e confirmei que isto não é uma vulnerabilidade.)
          required: true
