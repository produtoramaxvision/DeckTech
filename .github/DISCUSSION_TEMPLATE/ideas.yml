title: "[Idea]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should be solved? (Qual problema você quer resolver?)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context (Contexto)
      description: Give the platform and workflow, without sensitive data. (Informe plataforma e fluxo, sem dados sensíveis.)
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggestion (Sugestão)
